name: Release

# Push to `product` -> build macOS + Windows and publish a GitHub Release.
# The release tag comes from the VERSION file; if a tag for that version
# already exists, the run is a no-op (bump VERSION to cut a new release).
on:
  push:
    branches: [product]

permissions:
  contents: write          # create tags + releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need existing tags
      - id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$version already exists - bump VERSION to release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean Tappy.spec
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Tappy.app dist/Tappy-macOS.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Tappy -DestinationPath dist/Tappy-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tappy-${{ matrix.name }}
          path: dist/Tappy-*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need full history + tags to build the notes
      - name: Generate release notes
        run: |
          version="${{ needs.prepare.outputs.version }}"
          # Most recent existing release tag (the new v$version isn't created
          # until the release step below, so this resolves to the previous one).
          prev="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "### $prev 이후 변경사항"
              range="$prev..HEAD"
            else
              echo "### 변경사항"
              range="HEAD"
            fi
            echo
            git log "$range" --no-merges --pretty=format:'- %s'
            if [ -n "$prev" ]; then
              echo
              echo
              echo "**전체 변경 내역**: \`$prev...v$version\`"
            fi
          } > notes.md
          echo "----- release notes -----"
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Tappy v${{ needs.prepare.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
